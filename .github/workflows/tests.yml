name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to a pull request makes the earlier run pointless. Runs on main
# are never cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Code style, static analysis and the JavaScript checks. They need no
  # database, and run beside the PHP tests rather than ahead of them.
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, dom, curl, libxml, pgsql, pdo_pgsql, bcmath
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Linting (Pint)
      run: ./vendor/bin/pint --test

    - name: Run Static Analysis (PHPStan)
      run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Assets
      run: npm run build

    - name: Run JS Linting
      run: npm run lint

    - name: Run JS Tests
      run: npm test

  laravel-tests:
    runs-on: ubuntu-latest
    # MiConvener runs on PostgreSQL only, in production and in every test run.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, dom, curl, libxml, pgsql, pdo_pgsql, bcmath
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # Rebuilding four schemas with many FK/index relations can exhaust the
    # stock lock table. This changes only the disposable CI service container.
    - name: Allow parallel schema rebuilds
      env:
        POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      run: |
        docker exec "$POSTGRES_CONTAINER" psql -U postgres -d testing -c "ALTER SYSTEM SET max_locks_per_transaction = 256;"
        docker restart "$POSTGRES_CONTAINER"
        for attempt in {1..30}; do
          if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d testing; then
            exit 0
          fi
          sleep 1
        done
        exit 1

    # Each worker gets its own database (testing_test_1 ...).
    - name: Execute tests
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: |
        php artisan test --parallel --processes=4
        php artisan test --compact --bootstrap=tests/Support/without-telescope-bootstrap.php \
          tests/Unit/Support/WithoutTelescopeTest.php \
          tests/Feature/Marketplace/StoreCheckoutTest.php \
          tests/Feature/Marketplace/StoreReceiptsTest.php \
          tests/Feature/Marketplace/StoreReadyNoticesTest.php \
          tests/Feature/Marketplace/StoreRefundsTest.php \
          tests/Feature/Marketplace/StorePayoutsTest.php \
          tests/Feature/Community/PhoneVerificationTest.php
